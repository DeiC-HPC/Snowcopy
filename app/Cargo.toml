[package]
name = "snowcopy"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
aws_layer = { path = "../aws_layer" }
http_layer = { path = "../http_layer" }
util_layer = { path = "../util_layer"}
transfer_manager = { path = "../transfer_manager"}
config = { path = "../config" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.54", features = ["derive"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"
anyhow = "1.0"
indicatif = "0.18.4"
sysinfo = "0.38.2"
chrono = "0.4.44"
hex = "0.4.3"
tokio-util = "0.7.18"
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5.4"


[dev-dependencies]
assert_cmd = "2"
testcontainers = { version = "0.27.3", default-features = false, features = ["aws-lc-rs"] }
serde_json = "1.0"
uuid = { version = "1.24.0", features = ["v4"] }
http-body-util = "0.1"
bytes = "1"
hyper = "1"
http = "1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }