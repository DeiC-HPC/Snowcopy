[package]
name = "snowplowRust"
version = "0.1.0"
edition = "2024"

[dependencies]
aws_layer = { path = "../aws_layer" }
http_layer = { path = "../http_layer" }
util_layer = { path = "../util_layer"}
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4.5.54", features = ["derive"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"
futures = "0.3.31"
indicatif = "0.18.4"
sysinfo = "0.38.2"
mimalloc = "0.1.48"