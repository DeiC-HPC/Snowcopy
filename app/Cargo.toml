[package]
name = "snowcopy"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
aws_layer = { path = "../aws_layer" }
http_layer = { path = "../http_layer" }
util_layer = { path = "../util_layer"}
transfer_manager = { path = "../transfer_manager"}
config = { path = "../config" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.54", features = ["derive"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"
anyhow = "1.0"
indicatif = "0.18.4"
sysinfo = "0.38.2"
chrono = "0.4.44"
hex = "0.4.3"
tokio-util = "0.7.18"
hyper = "1"
hyper-util = "0.1.20"
mockall = "0.15.0"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5.4"
