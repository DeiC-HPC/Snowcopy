name: Cargo Build & Test

on:
  push:
    branches:
      - main
      - staging
      - development

  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check disk in the beginning
        run: |
          df -h
          docker system df

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check disk space after build
        run: |
          df -h
          docker system df

      - name: Free disk space
        run: |
          docker system prune -af || true
          df -h

      - name: Check disk space before tests
        run: |
          df -h
          docker system df

      - name: Test #This will build tests
        run: cargo test #--workspace -j 2 --verbose -- --test-threads=2 #Add parameters if github runner cannot handle parallel image execution