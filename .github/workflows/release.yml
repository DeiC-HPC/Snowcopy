name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CC_x86_64_unknown_linux_musl: musl-gcc

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          CARGO_VERSION=$(grep '^version *= *"' app/Cargo.toml \
          | head -1 \
          | sed -E 's/version *= *"([^"]+)"/\1/')
          
          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
          exit 1
          fi

      - name: Verify changelog contains version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md does not contain heading for version $TAG_VERSION"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MUSL tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build \
            --release \
            --manifest-path app/Cargo.toml \
            --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/snowcopy.exe \
               dist/${{ matrix.artifact }}/snowcopy.exe
          else
            cp target/${{ matrix.target }}/release/snowcopy \
               dist/${{ matrix.artifact }}/snowcopy
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            THIRD-PARTY-NOTICES.html