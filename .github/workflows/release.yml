name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CC_x86_64_unknown_linux_musl: musl-gcc

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: snowcopy-linux-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            package: snowcopy-macos-aarch64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: snowcopy-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          CARGO_VERSION=$(grep '^version *= *"' app/Cargo.toml \
            | head -1 \
            | sed -E 's/version *= *"([^"]+)"/\1/')

          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MUSL tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package

          cp THIRD-PARTY-NOTICES.html package/
          cp target/${{ matrix.target }}/release/snowcopy package/snowcopy

          tar -C package -czf "${{ matrix.package }}" .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package

          Copy-Item THIRD-PARTY-NOTICES.html package\
          Copy-Item target\${{ matrix.target }}\release\snowcopy.exe package\snowcopy.exe

          Compress-Archive `
            -Path package\* `
            -DestinationPath "${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/**/*
