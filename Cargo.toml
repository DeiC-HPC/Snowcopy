[package]
name = "snowplowRust"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.8.12", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.120.0"
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4.5.54", features = ["derive"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
futures = "0.3.31"
chrono = "0.4.43"
http = "1.4.0"
url = "2.5.8"
compio = { version = "0.17.0", features = ["macros", "tls"] }
cyper  = { version = "0.7.1", features = ["rustls"] }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }  # HTTPS via rustl
anyhow = "1.0.100"
crossbeam-channel = "0.5.15"  # HTTPS via rustl