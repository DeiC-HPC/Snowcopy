[package]
name = "transfer_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
util_layer = { path = "../util_layer"}
aws-sdk-s3-transfer-manager = "0.2.0"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-smithy-runtime = { version = "1", features = ["tls-rustls"] }
aws-credential-types = "1.1.7"
tokio = { version = "1", features = ["full"] }